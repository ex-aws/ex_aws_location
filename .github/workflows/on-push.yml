name: on-push
on: [push, pull_request]
env:
  MIX_ENV: test
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair:
              otp: 28.x
              elixir: 1.19.x
              lint: lint

          - pair:
              otp: 27.x
              elixir: 1.19.x
          - pair:
              otp: 27.x
              elixir: 1.18.x
          - pair:
              otp: 27.x
              elixir: 1.17.x

          - pair:
              otp: 26.x
              elixir: 1.18.x
          - pair:
              otp: 26.x
              elixir: 1.17.x
          - pair:
              otp: 26.x
              elixir: 1.16.x
          - pair:
              otp: 26.x
              elixir: 1.15.x

          - pair:
              otp: 25.x
              elixir: 1.16.x
          - pair:
              otp: 25.x
              elixir: 1.15.x

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.pair.otp}}
          elixir-version: ${{matrix.pair.elixir}}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{matrix.pair.otp}}-${{matrix.pair.elixir}}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{matrix.pair.otp}}-${{matrix.pair.elixir}}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
        if: ${{matrix.pair.lint}} # Only check formatting with the latest version
      - run: mix credo --strict
        if: ${{matrix.pair.lint}}
      - run: mix dialyzer
        if: ${{matrix.pair.lint}}
      - run: mix test
